name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Validate public content
        working-directory: website
        run: npm run docs:validate

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Type check
        working-directory: website
        run: npm run types:check

      - name: Build Next.js website
        working-directory: website
        run: npm run build

      - name: Check Vercel configuration
        id: vercel
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel deployment dilewati. Isi VERCEL_TOKEN, VERCEL_ORG_ID, dan VERCEL_PROJECT_ID pada GitHub Actions secrets."
          fi

      - name: Pull Vercel production settings
        if: steps.vercel.outputs.configured == 'true'
        run: npx --yes vercel@58.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.vercel.outputs.configured == 'true'
        run: npx --yes vercel@58.9.0 deploy --yes --prod --token="$VERCEL_TOKEN"
